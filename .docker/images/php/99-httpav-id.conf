; HTTPAV identifier passed into PHP for FPM requests (not visible to CLI/php -r).
; Expanded at container start by envplate (see Lagoon 70-php-config.sh) from Lagoon’s
; project and environment names. Defaults allow local (where those vars are unset).
; Pool name must match the active pool (usually www).
[www]
env[HTTPAV_IDENTIFIER] = ${LAGOON_PROJECT:-govcms}-${LAGOON_ENVIRONMENT:-local}
