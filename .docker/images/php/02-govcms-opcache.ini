[opcache]
; Huge pages are not available in Lagoon containers, so this setting has
; never taken effect. PHP 8.3 failed silently. Later PHP versions emit a
; warning on every PHP invocation:
;
;   PHP Warning:  Zend OPcache: opcache.huge_code_pages: program section
;   not found in Unknown on line 0
;
; The warning is written to stderr and corrupts any deploy script that
; parses drush output. Upstream sets this to 1 in
; /usr/local/etc/php/conf.d/00-lagoon-php.ini.tpl.
opcache.huge_code_pages = 0
