# Refuse to serve file types that GovCMS does not allow to be uploaded, however
# the file was stored. Keep the extension list in sync with
# GovcmsFileConstraintInterface::BLOCKED_EXTENSIONS in the govcms_security
# module.
#
# These checks run at server level, before a location is selected, so no other
# location can serve the file first. Trailing dots and spaces are ignored
# because Windows drops them when the downloaded file is saved.

# Public files, and private files requested as /system/files/<path>. Direct
# requests for the private directory keep their existing 404.
if ($uri ~* "^/(sites/default/files/(?!private/)|system/files/).+\.(doc|xls|ppt|rtf)[.\s]*$") {
    return 403;
}

# Private files requested as /system/files?file=<path>. Drupal never generates
# these URLs. The query string is not decoded here, so any percent-encoded
# value is refused too.
set $govcms_private_file_arg "";
if ($uri ~* "^/system/files") {
    set $govcms_private_file_arg $arg_file;
}
if ($govcms_private_file_arg ~* "(%|\.(doc|xls|ppt|rtf)[.\s]*$)") {
    return 403;
}
